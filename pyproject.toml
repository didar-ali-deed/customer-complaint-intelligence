[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-complaint-intelligence"
version = "1.0.0"
description = "Reproducible CFPB consumer complaint analytics pipeline"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "pyarrow>=15,<25", "requests>=2.31,<3", "tqdm>=4.66,<5", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["src*"]
